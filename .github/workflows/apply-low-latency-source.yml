name: Apply low-latency source changes

on:
  push:
    branches: [low-latency]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: low-latency
          fetch-depth: 0

      - name: Patch source files directly
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {n}")
              p.write_text(s.replace(old, new, 1))
              print(f"patched: {label}")

          replace_once(
              "src/usb_gamepad.c",
              '''    usb_in_buf[0] = DS5_USB_REPORT_ID_INPUT;\n    memcpy(usb_in_buf + 1, (const void *)pending_payload,\n           DS5_USB_INPUT_PAYLOAD_LEN);\n    ep_in_busy = true;\n    int ret = usbd_ep_start_write(0, USB_GAMEPAD_EP_IN, usb_in_buf, 64);\n    if (ret < 0) {\n        ep_in_busy = false;''',
              '''    /* Consume exactly one fresh report. Do not continuously pre-arm\n     * the previous controller state after each IN completion. */\n    ep_in_busy = true;\n    pending_active = false;\n    usb_in_buf[0] = DS5_USB_REPORT_ID_INPUT;\n    memcpy(usb_in_buf + 1, (const void *)pending_payload,\n           DS5_USB_INPUT_PAYLOAD_LEN);\n    int ret = usbd_ep_start_write(0, USB_GAMEPAD_EP_IN, usb_in_buf, 64);\n    if (ret < 0) {\n        ep_in_busy = false;\n        pending_active = true;''',
              "fresh-report USB IN"
          )

          replace_once(
              "src/usb_gamepad.c",
              '''int usb_gamepad_send_raw_input(const uint8_t *payload)\n{\n    memcpy((void *)pending_payload, payload, DS5_USB_INPUT_PAYLOAD_LEN);\n    pending_active = true;\n    try_send_pending();\n    return 0;\n}''',
              '''int usb_gamepad_send_raw_input(const uint8_t *payload)\n{\n    /* Publish only after the newest report has been copied completely.\n     * If an IN-completion IRQ fires during memcpy it sees no pending report. */\n    pending_active = false;\n    memcpy((void *)pending_payload, payload, DS5_USB_INPUT_PAYLOAD_LEN);\n    pending_active = true;\n    try_send_pending();\n    return 0;\n}''',
              "race-safe pending publish"
          )

          replace_once(
              "src/main.c",
              '''        uint8_t report[DS5_BT_INPUT_REPORT_SIZE];\n        memcpy(report, data, DS5_BT_INPUT_REPORT_SIZE);\n        xQueueOverwrite(input_queue, report);''',
              '''        /* xQueueOverwrite copies synchronously; avoid a redundant\n         * stack buffer + memcpy in the BT -> USB hot path. */\n        xQueueOverwrite(input_queue, data);''',
              "remove redundant BT input memcpy"
          )

          usb = Path("src/usb_gamepad.c").read_text()
          expected = "default: interval = 3; break;  /* HS 2^2=4µf  = 0.5ms → 2000Hz, effective ~750Hz */"
          if expected not in usb:
              raise SystemExit("HS realtime polling changed unexpectedly; expected 2000 Hz")

      - name: Commit direct source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-low-latency-source.yml
          git add src/usb_gamepad.c src/main.c
          git diff --cached --check
          git diff --cached -- src/usb_gamepad.c src/main.c
          git commit -m "perf: reduce BT-to-USB input latency"
          git push origin HEAD:low-latency
