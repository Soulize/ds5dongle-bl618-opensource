name: Apply direct low-latency source changes

on:
  push:
    branches: [low-latency]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-low-latency]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: low-latency
          fetch-depth: 0

      - name: Patch hot-path sources directly
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {n}")
              p.write_text(s.replace(old, new, 1))
              print(f"patched: {label}")

          replace_once(
              "src/usb_gamepad.c",
              '''    usb_in_buf[0] = DS5_USB_REPORT_ID_INPUT;
              memcpy(usb_in_buf + 1, (const void *)pending_payload,
                     DS5_USB_INPUT_PAYLOAD_LEN);
              ep_in_busy = true;
              int ret = usbd_ep_start_write(0, USB_GAMEPAD_EP_IN, usb_in_buf, 64);
              if (ret < 0) {
                  ep_in_busy = false;''',
              '''    /* Consume one fresh report; do not pre-arm stale input forever. */
              ep_in_busy = true;
              pending_active = false;
              usb_in_buf[0] = DS5_USB_REPORT_ID_INPUT;
              memcpy(usb_in_buf + 1, (const void *)pending_payload,
                     DS5_USB_INPUT_PAYLOAD_LEN);
              int ret = usbd_ep_start_write(0, USB_GAMEPAD_EP_IN, usb_in_buf, 64);
              if (ret < 0) {
                  ep_in_busy = false;
                  pending_active = true;''',
              "fresh-report USB IN"
          )

          replace_once(
              "src/usb_gamepad.c",
              '''int usb_gamepad_send_raw_input(const uint8_t *payload)
          {
              memcpy((void *)pending_payload, payload, DS5_USB_INPUT_PAYLOAD_LEN);
              pending_active = true;
              try_send_pending();
              return 0;
          }''',
              '''int usb_gamepad_send_raw_input(const uint8_t *payload)
          {
              /* Publish only after the complete newest report has been copied. */
              pending_active = false;
              memcpy((void *)pending_payload, payload, DS5_USB_INPUT_PAYLOAD_LEN);
              pending_active = true;
              try_send_pending();
              return 0;
          }''',
              "race-safe pending publish"
          )

          replace_once(
              "src/usb_gamepad.c",
              "default: interval = 3; break;  /* HS 2^2=4µf  = 0.5ms → 2000Hz, effective ~750Hz */",
              "default: interval = 2; break;  /* HS 2^1=2µf  = 0.25ms → 4000Hz, BT-limited ~750Hz */",
              "HS realtime 250us polling"
          )

          replace_once(
              "src/main.c",
              '''        uint8_t report[DS5_BT_INPUT_REPORT_SIZE];
              memcpy(report, data, DS5_BT_INPUT_REPORT_SIZE);
              xQueueOverwrite(input_queue, report);''',
              '''        /* Queue copies synchronously; keep only the newest BT state. */
              xQueueOverwrite(input_queue, data);''',
              "remove redundant BT input memcpy"
          )

      - name: Commit direct source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/usb_gamepad.c src/main.c
          git diff --cached --check
          git commit -m "perf: reduce BT-to-USB input latency"
          git push origin HEAD:low-latency
