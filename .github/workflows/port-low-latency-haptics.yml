name: Port low-latency haptics pipeline

on:
  push:
    branches: [low-latency]

permissions:
  contents: write

jobs:
  port-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          ref: low-latency
          path: ds5dongle
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Bouffalo SDK
        uses: actions/checkout@v4
        with:
          repository: sqlCRT/bouffalo_sdk
          ref: 29daef17f1ff37f83445e54ba20a2659352b6e9e
          path: bouffalo_sdk
          submodules: recursive

      - name: Checkout T-Head toolchain
        uses: actions/checkout@v4
        with:
          repository: bouffalolab/toolchain_gcc_t-head_linux
          ref: c4afe91cbd01bf7dce525e0d23b4219c8691e8f0
          path: bouffalo_sdk/tools/toolchain_gcc_t-head_linux

      - name: Apply direct source port
        working-directory: ds5dongle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return text.replace(old, new, 1)

          def replace_region(text, start, end, new, label):
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f"{label}: start anchor missing")
              j = text.find(end, i)
              if j < 0:
                  raise SystemExit(f"{label}: end anchor missing")
              j += len(end)
              return text[:i] + new + text[j:]

          # ---- USB producer: expose one 512-sample frame every 10.67 ms ----
          p = Path("src/ds5_usb_audio.h")
          s = p.read_text()
          pattern = re.compile(
              r"/\* 1024 samples per channel accumulated before processing\..*?\*/\n"
              r"#define USB_AUDIO_ACCUM_SAMPLES 1024",
              re.S,
          )
          new = (
              "/* One 512-sample producer frame per channel.\n"
              " * 512/48000 = 10.67ms. audio.c prepares haptics/Opus per frame,\n"
              " * then batches two prepared frames into the unchanged DualSense 0x39.\n"
              " * A two-frame ready backlog absorbs short scheduler stalls. */\n"
              "#define USB_AUDIO_ACCUM_SAMPLES 512"
          )
          s, n = pattern.subn(new, s, count=1)
          if n != 1:
              raise SystemExit(f"USB frame size comment: expected 1 match, found {n}")
          p.write_text(s)

          p = Path("src/ds5_usb_audio.c")
          s = p.read_text()
          s = replace_once(
              s,
              '#include "semphr.h"\n#include <string.h>',
              '#include "semphr.h"\n#include "task.h"\n#include <string.h>',
              "task critical include",
          )

          s = replace_region(
              s,
              "/* ---- Double buffer for ISO PCM accumulation ---- */",
              "static uint8_t           pcm_read_idx = 0;",
              """/* ---- Low-latency PCM frame ring ----
           * One buffer is being filled while up to two complete 512-sample frames
           * wait for audio_task. Memory use is lower than the old 2x1024 ping-pong. */
          #define PCM_BUF_SAMPLES  USB_AUDIO_ACCUM_SAMPLES
          #define PCM_BUF_BYTES    (PCM_BUF_SAMPLES * USB_AUDIO_CHANNELS * sizeof(int16_t))
          #define PCM_BUF_COUNT    3
          #define PCM_READY_MAX    (PCM_BUF_COUNT - 1)

          static int16_t pcm_buf[PCM_BUF_COUNT][PCM_BUF_SAMPLES * USB_AUDIO_CHANNELS];
          static volatile uint32_t pcm_write_pos = 0;
          static volatile uint8_t  pcm_write_idx = 0;
          static volatile uint8_t  pcm_read_idx = 0;
          static volatile uint8_t  pcm_ready_count = 0;""".replace("          ", ""),
              "PCM ring declaration",
          )

          old_roll_end = "        } else {\n            pcm_write_pos = pos;\n        }"
          new_roll = (
              "        if (pos >= PCM_BUF_SAMPLES * USB_AUDIO_CHANNELS) {\n"
              "            pcm_write_pos = 0;\n"
              "\n"
              "            BaseType_t woken = pdFALSE;\n"
              "            if (pcm_ready_count < PCM_READY_MAX) {\n"
              "                pcm_ready_count++;\n"
              "                pcm_write_idx = (uint8_t)((pcm_write_idx + 1) % PCM_BUF_COUNT);\n"
              "                xSemaphoreGiveFromISR(audio_sem, &woken);\n"
              "            } else {\n"
              "                /* Backlog full: discard oldest complete frame and keep\n"
              "                 * the newest two instead of growing output latency. */\n"
              "                pcm_read_idx = (uint8_t)((pcm_read_idx + 1) % PCM_BUF_COUNT);\n"
              "                pcm_write_idx = (uint8_t)((pcm_write_idx + 1) % PCM_BUF_COUNT);\n"
              "            }\n"
              "            portYIELD_FROM_ISR(woken);\n"
              "        } else {\n"
              "            pcm_write_pos = pos;\n"
              "        }"
          )
          s = replace_region(
              s,
              "        if (pos >= PCM_BUF_SAMPLES * USB_AUDIO_CHANNELS) {",
              old_roll_end,
              new_roll,
              "PCM producer rollover",
          )

          s = replace_once(
              s,
              "        pcm_write_pos = 0;\n        pcm_write_idx = 0;\n        pcm_ready = false;",
              "        pcm_write_pos = 0;\n        pcm_write_idx = 0;\n        pcm_read_idx = 0;\n        pcm_ready_count = 0;",
              "stream open reset",
          )
          s = replace_once(
              s,
              "audio_sem = xSemaphoreCreateCountingStatic(2, 0, &audio_sem_buf);",
              "audio_sem = xSemaphoreCreateCountingStatic(PCM_READY_MAX, 0, &audio_sem_buf);",
              "counting semaphore depth",
          )
          s = replace_once(
              s,
              "    pcm_write_pos = 0;\n    pcm_write_idx = 0;\n    pcm_ready = false;\n    state_mgr_set_spk_active(false);",
              "    pcm_write_pos = 0;\n    pcm_write_idx = 0;\n    pcm_read_idx = 0;\n    pcm_ready_count = 0;\n    state_mgr_set_spk_active(false);",
              "stream stop reset",
          )

          read_start = "bool usb_audio_read(int16_t *out)\n{"
          read_end = "\n\nvoid *usb_audio_get_semaphore(void)"
          read_impl = (
              "bool usb_audio_read(int16_t *out)\n"
              "{\n"
              "    bool ok = false;\n"
              "\n"
              "    /* Prevent the ISO ISR from recycling the selected 4KB frame while\n"
              "     * it is copied. The critical section is tiny versus the 1ms USB\n"
              "     * audio cadence and gives deterministic ring ownership. */\n"
              "    taskENTER_CRITICAL();\n"
              "    if (pcm_ready_count != 0) {\n"
              "        uint8_t idx = pcm_read_idx;\n"
              "        memcpy(out, pcm_buf[idx], PCM_BUF_BYTES);\n"
              "        pcm_read_idx = (uint8_t)((pcm_read_idx + 1) % PCM_BUF_COUNT);\n"
              "        pcm_ready_count--;\n"
              "        ok = true;\n"
              "    }\n"
              "    taskEXIT_CRITICAL();\n"
              "    return ok;\n"
              "}"
              "\n\nvoid *usb_audio_get_semaphore(void)"
          )
          s = replace_region(s, read_start, read_end, read_impl, "PCM consumer")
          if "pcm_ready" in s:
              raise SystemExit("legacy pcm_ready state still present")
          p.write_text(s)

          # ---- Audio producer/compositor: prepare one frame at a time ----
          p = Path("src/audio.c")
          s = p.read_text()
          s = replace_region(
              s,
              "#define ACCUM_SAMPLES       USB_AUDIO_ACCUM_SAMPLES  /* 1024 = 2 Opus frames */",
              "#define HALF_ACCUM          (ACCUM_SAMPLES / 2)      /* 512 */",
              "#define ACCUM_SAMPLES       USB_AUDIO_ACCUM_SAMPLES  /* 512 = one producer frame */\n"
              "#define AUDIO_BATCH_FRAMES  2       /* DualSense 0x39 carries two frames */",
              "audio frame constants",
          )
          if s.count("HALF_ACCUM") < 3:
              raise SystemExit("unexpected HALF_ACCUM use count")
          s = s.replace("HALF_ACCUM", "ACCUM_SAMPLES")

          s = replace_once(
              s,
              "static __attribute__((aligned(32))) uint8_t  opus_slots[2][OPUS_OUT_SIZE];\n"
              "static __attribute__((aligned(32))) int8_t   haptic_slots[2][HAPTIC_BUF_SIZE];",
              "static __attribute__((aligned(32))) uint8_t  opus_slots[AUDIO_BATCH_FRAMES][OPUS_OUT_SIZE];\n"
              "static __attribute__((aligned(32))) int8_t   haptic_slots[AUDIO_BATCH_FRAMES][HAPTIC_BUF_SIZE];\n"
              "static uint8_t  audio_batch_count;\n"
              "static bool     audio_batch_speaker;\n"
              "static bool     audio_batch_headset;\n"
              "static int      audio_batch_channels;",
              "audio batch state",
          )

          s = replace_once(
              s,
              "static int send_audio_report(void)",
              "static int send_audio_report(bool speaker_enabled, bool headset_output)",
              "compositor signature",
          )
          s = replace_once(
              s,
              "    /* Speaker Opus (tag 0xD3/0xD6, 2x 200-byte blocks) */\n"
              "    bool speaker_enabled = !config_get()->disable_speaker;\n"
              "    if (speaker_enabled) {\n"
              "        pkt[140] = plug_headset ? DS5_AUDIO_TAG_HEADSET : DS5_AUDIO_TAG_SPEAKER;",
              "    /* Speaker Opus is optional; haptics producer state is independent. */\n"
              "    if (speaker_enabled) {\n"
              "        pkt[140] = headset_output ? DS5_AUDIO_TAG_HEADSET : DS5_AUDIO_TAG_SPEAKER;",
              "optional speaker payload",
          )

          s = replace_once(
              s,
              "    memset(opus_slots, 0, sizeof(opus_slots));\n"
              "    memset(haptic_slots, 0, sizeof(haptic_slots));\n\n"
              "    encode_watchdog =",
              "    memset(opus_slots, 0, sizeof(opus_slots));\n"
              "    memset(haptic_slots, 0, sizeof(haptic_slots));\n"
              "    audio_batch_count = 0;\n"
              "    audio_batch_speaker = false;\n"
              "    audio_batch_headset = false;\n"
              "    audio_batch_channels = 1;\n\n"
              "    encode_watchdog =",
              "audio init batch reset",
          )

          producer_start = "                for (int slot = 0; slot < 2; slot++) {"
          producer_end = "#if LOG_LEVEL >= 3\n                uint64_t t_send0 = bflb_mtimer_get_time_us();\n#endif\n"
          producer = """                /* DS5_Bridge-style producer separation: process one 512-sample
                   USB frame as soon as it is complete. The Bluetooth 0x39 format
                   remains a two-frame compositor. */
                if (audio_batch_count != 0 &&
                    (audio_batch_speaker != speaker_on ||
                     audio_batch_headset != plug_headset ||
                     audio_batch_channels != target_channels)) {
                    audio_batch_count = 0;
                }
                if (audio_batch_count == 0) {
                    audio_batch_speaker = speaker_on;
                    audio_batch_headset = plug_headset;
                    audio_batch_channels = target_channels;
                }

                const int slot = audio_batch_count;
                const int16_t *slot_pcm = pcm_block;

#if LOG_LEVEL >= 3
                uint64_t t_hap0 = bflb_mtimer_get_time_us();
#endif
                if (ah_mode == 2) {
                    audio_to_haptic(slot_pcm, haptic_slots[slot], ACCUM_SAMPLES);
                } else if (ah_mode == 1 &&
                           haptic_channel_silent(slot_pcm, ACCUM_SAMPLES)) {
                    audio_to_haptic(slot_pcm, haptic_slots[slot], ACCUM_SAMPLES);
                } else {
                    decimate_haptics(slot_pcm, haptic_slots[slot], ACCUM_SAMPLES);
                }
#if LOG_LEVEL >= 3
                prof_haptic += bflb_mtimer_get_time_us() - t_hap0;
#endif

                /* Optional speaker producer. Frame 0 is encoded roughly one USB
                 * producer period earlier than with the old 1024-sample batch. */
                if (speaker_on) {
#if LOG_LEVEL >= 3
                    uint64_t t_res0 = bflb_mtimer_get_time_us();
#endif
                    deinterleave_4ch(slot_pcm, ACCUM_SAMPLES);
                    int mono = (encoder_channels == 1);
                    resample_512_480(slot_pcm, spk_resamp, mono);
#if LOG_LEVEL >= 3
                    prof_resamp += bflb_mtimer_get_time_us() - t_res0;
#endif

                    encode_start_us = bflb_mtimer_get_time_us();
                    encoding_in_progress = true;
                    int encoded = opus_encode(encoder, spk_resamp, OPUS_FRAME_SAMPLES,
                                              opus_slots[slot], OPUS_OUT_SIZE);
                    encoding_in_progress = false;
#if LOG_LEVEL >= 3
                    prof_opus += bflb_mtimer_get_time_us() - encode_start_us;
#endif
                    if (encoder_reset_pending) {
                        encoder_reset_pending = false;
                        opus_encoder_ctl(encoder, OPUS_RESET_STATE);
                    }
                    if (encoded <= 0) {
                        LOG_ERR("[AUDIO] Opus encode error: %d\\n", encoded);
                        memset(opus_slots[slot], 0, OPUS_OUT_SIZE);
                    } else if (encoded < OPUS_OUT_SIZE) {
                        int pad_ret = opus_packet_pad(opus_slots[slot], encoded, OPUS_OUT_SIZE);
                        if (pad_ret != OPUS_OK)
                            memset(opus_slots[slot] + encoded, 0, OPUS_OUT_SIZE - encoded);
                    }
                } else {
                    memset(opus_slots[slot], 0, OPUS_OUT_SIZE);
                }

                audio_batch_count++;
                if (audio_batch_count < AUDIO_BATCH_FRAMES)
                    goto audio_frame_done;

                /* Both haptic slots are ready. Do not insert the old fixed 1ms
                 * mic delay; mic decode already runs in its own FreeRTOS task. */
                audio_batch_count = 0;

"""
          s = replace_region(s, producer_start, producer_end, producer + producer_end, "producer pipeline")
          s = replace_once(
              s,
              "                int send_ret = send_audio_report();",
              "                int send_ret = send_audio_report(audio_batch_speaker, audio_batch_headset);",
              "compositor call",
          )

          tail = "\n            }\n        }\n\n        if (mic_status_pending &&"
          tail_new = "\n            audio_frame_done:\n                ;\n            }\n        }\n\n        if (mic_status_pending &&"
          task_pos = s.find("void audio_task(void *arg)")
          tail_pos = s.find(tail, task_pos)
          if tail_pos < 0:
              raise SystemExit("audio task tail anchor missing")
          s = s[:tail_pos] + tail_new + s[tail_pos + len(tail):]

          respawn_pos = s.find("bool audio_check_respawn(void)")
          marker = "    audio_task_killed = false;"
          mark_pos = s.find(marker, respawn_pos)
          if mark_pos < 0:
              raise SystemExit("respawn reset anchor missing")
          mark_end = mark_pos + len(marker)
          s = s[:mark_end] + "\n    audio_batch_count = 0;" + s[mark_end:]

          for fn in ("void audio_reset(void)", "void audio_reset_encoder(void)"):
              fn_pos = s.find(fn)
              if fn_pos < 0:
                  raise SystemExit(f"{fn}: missing")
              marker = "    memset(haptic_slots, 0, sizeof(haptic_slots));"
              m = s.find(marker, fn_pos)
              if m < 0:
                  raise SystemExit(f"{fn}: slot reset missing")
              m += len(marker)
              s = s[:m] + "\n    audio_batch_count = 0;" + s[m:]

          if "vTaskDelay(pdMS_TO_TICKS(1))" in s:
              raise SystemExit("fixed 1ms mic delay still present")
          p.write_text(s)
          print("Direct source port applied successfully")
          PY

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make ninja-build python3
          chmod -R +x bouffalo_sdk/tools/toolchain_gcc_t-head_linux/bin

      - name: Build LCTech BL616 HS firmware
        working-directory: ds5dongle
        env:
          USB_SPEED: hs
        run: |
          chmod +x build_macos.sh build_lctech616.sh
          ./build_lctech616.sh rebuild

      - name: Commit direct source changes
        working-directory: ds5dongle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/port-low-latency-haptics.yml
          git add src/audio.c src/ds5_usb_audio.c src/ds5_usb_audio.h
          git commit -m "perf: pipeline haptics and speaker audio"
          git push origin HEAD:low-latency
