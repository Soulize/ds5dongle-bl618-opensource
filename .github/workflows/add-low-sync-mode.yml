name: Validate aligned low-latency sync mode

on:
  push:
    branches: [low-latency]
    paths:
      - .github/workflows/add-low-sync-mode.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v7.0.1
        with:
          path: ds5dongle
          ref: low-latency
          fetch-depth: 0

      - name: Checkout Bouffalo SDK
        uses: actions/checkout@v7.0.1
        with:
          repository: sqlCRT/bouffalo_sdk
          ref: 29daef17f1ff37f83445e54ba20a2659352b6e9e
          path: bouffalo_sdk
          submodules: recursive

      - name: Checkout T-Head RISC-V toolchain
        uses: actions/checkout@v7.0.1
        with:
          repository: bouffalolab/toolchain_gcc_t-head_linux
          ref: c4afe91cbd01bf7dce525e0d23b4219c8691e8f0
          path: bouffalo_sdk/tools/toolchain_gcc_t-head_linux

      - name: Apply low-sync mode
        working-directory: ds5dongle
        run: python3 tools/add-low-sync-mode.py

      - name: Verify scheduler invariants
        working-directory: ds5dongle
        run: |
          grep -q 'HAPTIC_LATENCY_LOW_SYNC    = 3' src/config.h
          grep -q 'haptic_latency_mode > HAPTIC_LATENCY_LOW_SYNC' src/config.c
          grep -q 'latency_mode == HAPTIC_LATENCY_LOW_SYNC' src/audio.c
          grep -q 'encode_speaker_frame(slot_pcm, opus_slots\[0\])' src/audio.c
          grep -q 'encode_speaker_frame(slot_pcm, opus_slots\[1\])' src/audio.c
          grep -q 'default: interval = 3' src/usb_gamepad.c
          git diff --check

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make ninja-build python3
          chmod -R +x "${GITHUB_WORKSPACE}/bouffalo_sdk/tools/toolchain_gcc_t-head_linux/bin"
          echo "${GITHUB_WORKSPACE}/bouffalo_sdk/tools/toolchain_gcc_t-head_linux/bin" >> "$GITHUB_PATH"

      - name: Build LCTech BL616 HS
        working-directory: ds5dongle
        env:
          USB_SPEED: hs
        run: |
          chmod +x build_macos.sh build_lctech616.sh
          ./build_lctech616.sh rebuild

      - name: Upload validation firmware
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ds5dongle-lctech616-hs-low-sync
          path: ds5dongle/firmware/lctech616/
          if-no-files-found: error
          retention-days: 30

      - name: Commit validated source changes
        working-directory: ds5dongle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config.h src/config.c src/audio.c LATENCY_MODES.md
          git rm tools/add-low-sync-mode.py .github/workflows/add-low-sync-mode.yml
          git commit -m 'feat: add aligned low-latency haptics mode'
          git push origin HEAD:low-latency
