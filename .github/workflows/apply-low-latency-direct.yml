name: Apply low-latency source changes

on:
  push:
    branches: [low-latency]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: low-latency
          fetch-depth: 0

      - name: Patch source hot paths
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              p.write_text(s.replace(old, new, 1))
              print(f"patched: {label}")

          replace_once(
              "src/usb_gamepad.c",
              '''    usb_in_buf[0] = DS5_USB_REPORT_ID_INPUT;
              memcpy(usb_in_buf + 1, (const void *)pending_payload,
                     DS5_USB_INPUT_PAYLOAD_LEN);
              ep_in_busy = true;
              int ret = usbd_ep_start_write(0, USB_GAMEPAD_EP_IN, usb_in_buf, 64);
              if (ret < 0) {
                  ep_in_busy = false;''',
              '''    /* Consume one fresh report. Keep the endpoint idle when no newer
               * Bluetooth state is pending, avoiding a stale one-transfer pipeline. */
              ep_in_busy = true;
              pending_active = false;
              usb_in_buf[0] = DS5_USB_REPORT_ID_INPUT;
              memcpy(usb_in_buf + 1, (const void *)pending_payload,
                     DS5_USB_INPUT_PAYLOAD_LEN);
              int ret = usbd_ep_start_write(0, USB_GAMEPAD_EP_IN, usb_in_buf, 64);
              if (ret < 0) {
                  ep_in_busy = false;
                  pending_active = true;''',
              "fresh-report USB IN"
          )

          replace_once(
              "src/usb_gamepad.c",
              '''int usb_gamepad_send_raw_input(const uint8_t *payload)
          {
              memcpy((void *)pending_payload, payload, DS5_USB_INPUT_PAYLOAD_LEN);
              pending_active = true;
              try_send_pending();
              return 0;
          }''',
              '''int usb_gamepad_send_raw_input(const uint8_t *payload)
          {
              /* Publish only after the newest report has been copied completely.
               * If the USB completion ISR fires during memcpy it sees no pending
               * report, so it cannot consume a partially updated payload. */
              pending_active = false;
              memcpy((void *)pending_payload, payload, DS5_USB_INPUT_PAYLOAD_LEN);
              pending_active = true;
              try_send_pending();
              return 0;
          }''',
              "race-safe newest-report publish"
          )

          replace_once(
              "src/main.c",
              '''        uint8_t report[DS5_BT_INPUT_REPORT_SIZE];
              memcpy(report, data, DS5_BT_INPUT_REPORT_SIZE);
              xQueueOverwrite(input_queue, report);''',
              '''        /* xQueueOverwrite copies synchronously; avoid an extra
               * whole-report stack copy while preserving latest-state semantics. */
              xQueueOverwrite(input_queue, data);''',
              "remove redundant BT input memcpy"
          )

          # Deliberately keep HS realtime bInterval=3 (0.5 ms / 2000 Hz).
          usb = Path("src/usb_gamepad.c").read_text()
          expected = "default: interval = 3; break;  /* HS 2^2=4µf  = 0.5ms → 2000Hz, effective ~750Hz */"
          if expected not in usb:
              raise SystemExit("2000 Hz HS realtime descriptor changed unexpectedly")

      - name: Commit direct source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-low-latency-direct.yml
          git add src/usb_gamepad.c src/main.c
          git diff --cached --check
          git commit -m "perf: reduce BT-to-USB latency while keeping 2000Hz USB polling"
          git push origin HEAD:low-latency
